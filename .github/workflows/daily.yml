name: Daily job market refresh

on:
  schedule:
    - cron: "17 4 * * *"   # every day ~05:17 Berlin time
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Extract, transform, publish
        run: bash scripts/run_pipeline.sh

      - name: Commit new data and dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi
